openapi: 3.0.3
info:
  title: API Contract
  description: API theo chuẩn JSend và định nghĩa Rate-limit
  version: 1.0.0
servers:
  - url: 'http://localhost:3000/api/v1'
    description: Môi trường Development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    JSendSuccess:
      type: object
      properties:
        status:
          type: string
          example: "success"
        data:
          type: object

    JSendError:
      type: object
      properties:
        status:
          type: string
          example: "error"
        message:
          type: string
        code:
          type: integer

# Define Rate Limit Extensions (x-rate-limit) for API Gateway
x-rate-limit:
  default:
    limit: 100
    window: 60s
  auth_endpoints:
    limit: 5
    window: 60s

paths:
  /health:
    get:
      summary: Health check endpoint
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSendSuccess'
